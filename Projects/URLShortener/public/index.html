<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shorten — URL Shortener</title>
    <link rel="stylesheet" href="index.css">

    
</head>

<body>

    <main class="page">

        <section class="container">

            <div class="content">

                <!-- <div class="logo">
                    ↗
                </div> -->

                <h1>Make links shorter.</h1>

                <p class="description">
                    Turn long, complicated URLs into simple links
                    that are easy to share.
                </p>

                <form id="urlForm">

                    <div class="input-wrapper">

                        <label
                            class="input-label"
                            for="longURL"
                        >
                            Your long URL
                        </label>

                        <input
                            type="url"
                            id="longURL"
                            placeholder="https://example.com/your-long-url"
                            autocomplete="url"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="submit-btn"
                        id="submitBtn"
                    >
                        <span id="buttonText">
                            Shorten URL
                        </span>

                        <span
                            class="arrow"
                            id="arrow"
                        >
                            →
                        </span>
                    </button>

                </form>

                <div
                    class="error"
                    id="error"
                ></div>

                <div
                    class="result"
                    id="result"
                >

                    <div class="result-header">

                        <div class="success-icon">
                            ✓
                        </div>

                        <p class="result-title">
                            Your link is ready
                        </p>

                    </div>

                    <div class="short-url-container">

                        <input
                            type="text"
                            id="shortURL"
                            readonly
                        >

                        <button
                            type="button"
                            class="copy-btn"
                            id="copyBtn"
                        >
                            Copy
                        </button>

                    </div>

                    <a
                        href="#"
                        class="open-link"
                        id="openLink"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Open shortened link ↗
                    </a>

                </div>

                <div class="footer">
                    Simple. Fast. <span>Shareable.</span>
                </div>

            </div>

        </section>

    </main>


    <script>
        const form = document.getElementById("urlForm");

        const longURLInput =
            document.getElementById("longURL");

        const submitBtn =
            document.getElementById("submitBtn");

        const buttonText =
            document.getElementById("buttonText");

        const arrow =
            document.getElementById("arrow");

        const result =
            document.getElementById("result");

        const shortURLInput =
            document.getElementById("shortURL");

        const openLink =
            document.getElementById("openLink");

        const copyBtn =
            document.getElementById("copyBtn");

        const error =
            document.getElementById("error");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const longURL =
                longURLInput.value.trim();

            // Reset states
            error.style.display = "none";
            result.style.display = "none";

            // Loading state
            submitBtn.disabled = true;

            buttonText.textContent = "Shortening...";
            arrow.innerHTML =
                '<span class="spinner"></span>';


            try {

                const response = await fetch(
                    "/api/v1/data",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            longURL
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        "Unable to shorten this URL."
                    );
                }


                // Display result
                shortURLInput.value =
                    data.shortURL;

                openLink.href =
                    data.shortURL;

                result.style.display =
                    "block";


            } catch (err) {

                error.textContent =
                    err.message;

                error.style.display =
                    "block";

            } finally {

                submitBtn.disabled = false;

                buttonText.textContent =
                    "Shorten URL";

                arrow.textContent = "→";
            }

        });


        copyBtn.addEventListener(
            "click",
            async () => {

                const url =
                    shortURLInput.value;

                try {

                    await navigator.clipboard
                        .writeText(url);

                    copyBtn.textContent =
                        "Copied ✓";

                    setTimeout(() => {

                        copyBtn.textContent =
                            "Copy";

                    }, 1800);

                } catch (err) {

                    // Fallback
                    shortURLInput.select();

                    document.execCommand(
                        "copy"
                    );

                    copyBtn.textContent =
                        "Copied ✓";

                    setTimeout(() => {

                        copyBtn.textContent =
                            "Copy";

                    }, 1800);
                }

            }
        );


        // Select URL when clicking the output
        shortURLInput.addEventListener(
            "click",
            () => {
                shortURLInput.select();
            }
        );
    </script>

</body>
</html>
