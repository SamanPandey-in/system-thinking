<title>Paste — Simple PasteBin</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
        --forest-950: #18251f;
        --forest-900: #1d3027;
        --forest-800: #274536;
        --forest-700: #315b45;
        --forest-600: #416b52;

        --cream: #f5f1e7;
        --cream-soft: #eee9dc;

        --text: #1c2c24;
        --text-muted: #627068;

        --glass: rgba(245, 241, 231, 0.68);
        --glass-light: rgba(255, 252, 243, 0.52);
        --border: rgba(255, 255, 255, 0.58);

        --shadow:
            0 30px 80px rgba(25, 42, 33, 0.30),
            0 8px 30px rgba(25, 42, 33, 0.15);
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family: "DM Sans", sans-serif;
        color: var(--text);

        display: flex;
        justify-content: center;
        align-items: center;

        overflow-x: hidden;

        background-image:
            linear-gradient(
                135deg,
                rgba(31, 47, 39, 0.20),
                rgba(31, 47, 39, 0.05) 45%,
                rgba(20, 35, 28, 0.25)
            ),
            url("/img.jpg");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    /* Atmospheric glow */
    body::before {
        content: "";

        position: fixed;
        inset: 0;

        pointer-events: none;

        background:
            radial-gradient(
                circle at 20% 20%,
                rgba(255, 245, 220, 0.25),
                transparent 35%
            ),
            radial-gradient(
                circle at 85% 75%,
                rgba(54, 91, 68, 0.20),
                transparent 35%
            );

        z-index: -1;
    }

    /* Main wrapper */
    .page {
        width: 100%;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 24px;
    }

    /* Glass card */
    .container {
        position: relative;

        width: min(92vw, 650px);

        padding: 44px;

        border-radius: 28px;

        background:
            linear-gradient(
                145deg,
                rgba(255, 252, 243, 0.72),
                rgba(236, 233, 220, 0.52)
            );

        border: 1px solid var(--border);

        backdrop-filter: blur(24px) saturate(120%);
        -webkit-backdrop-filter: blur(24px) saturate(120%);

        box-shadow: var(--shadow);

        overflow: hidden;

        animation: cardIn 0.7s cubic-bezier(.2,.8,.2,1);
    }

    /* Top glass highlight */
    .container::before {
        content: "";

        position: absolute;

        top: -120px;
        left: -120px;

        width: 280px;
        height: 280px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.28);

        filter: blur(20px);

        pointer-events: none;
    }

    /* Bottom green tint */
    .container::after {
        content: "";

        position: absolute;

        right: -100px;
        bottom: -140px;

        width: 300px;
        height: 300px;

        border-radius: 50%;

        background: rgba(49, 91, 69, 0.10);

        filter: blur(35px);

        pointer-events: none;
    }

    .content {
        position: relative;
        z-index: 1;
    }

    /* Logo */
    .logo {
        width: 52px;
        height: 52px;

        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 16px;

        background: var(--forest-800);
        color: var(--cream);

        font-size: 22px;
        font-weight: 700;

        box-shadow:
            0 8px 20px rgba(39, 69, 54, 0.28),
            inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    h1 {
        margin: 0;

        text-align: center;

        color: var(--forest-950);

        font-size: clamp(30px, 5vw, 38px);

        line-height: 1.1;

        letter-spacing: -1.4px;

        font-weight: 700;
    }

    .description {
        max-width: 430px;

        margin: 14px auto 30px;

        text-align: center;

        color: var(--text-muted);

        font-size: 15px;
        line-height: 1.6;
    }

    /* Text area */
    .input-wrapper {
        position: relative;
    }

    .input-label {
        display: block;

        margin-bottom: 8px;

        color: var(--forest-900);

        font-size: 13px;
        font-weight: 600;
    }

    textarea {
        width: 100%;

        min-height: 240px;

        padding: 17px;

        resize: vertical;

        border: 1px solid rgba(49, 91, 69, 0.18);

        border-radius: 14px;

        outline: none;

        background: rgba(255, 252, 244, 0.62);

        color: var(--forest-950);

        font-family: "DM Sans", sans-serif;

        font-size: 14px;
        line-height: 1.6;

        box-shadow:
            inset 0 1px 2px rgba(31, 47, 39, 0.04);

        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }

    textarea::placeholder {
        color: #8b968f;
    }

    textarea:hover {
        background: rgba(255, 252, 244, 0.75);
    }

    textarea:focus {
        background: rgba(255, 252, 244, 0.9);

        border-color: var(--forest-600);

        box-shadow:
            0 0 0 4px rgba(65, 107, 82, 0.10);
    }

    /* Character counter */
    .textarea-footer {
        display: flex;

        justify-content: flex-end;

        margin-top: 7px;

        color: #7b877f;

        font-size: 11px;
    }

    /* Submit button */
    .submit-btn {
        width: 100%;
        height: 56px;

        margin-top: 14px;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 9px;

        border: 0;
        border-radius: 14px;

        background:
            linear-gradient(
                135deg,
                var(--forest-800),
                var(--forest-700)
            );

        color: #f8f5ec;

        font-family: inherit;

        font-size: 15px;
        font-weight: 600;

        cursor: pointer;

        box-shadow:
            0 8px 20px rgba(39, 69, 54, 0.25);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            filter 0.2s ease;
    }

    .submit-btn:hover {
        transform: translateY(-2px);

        filter: brightness(1.06);

        box-shadow:
            0 12px 26px rgba(39, 69, 54, 0.32);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    .submit-btn:disabled {
        opacity: 0.65;

        cursor: not-allowed;

        transform: none;
    }

    .arrow {
        font-size: 18px;

        transition:
            transform 0.2s ease;
    }

    .submit-btn:hover .arrow {
        transform: translateX(3px);
    }

    /* Result */
    .result {
        display: none;

        margin-top: 22px;

        padding: 18px;

        border-radius: 17px;

        background:
            linear-gradient(
                135deg,
                rgba(222, 234, 220, 0.66),
                rgba(240, 239, 226, 0.52)
            );

        border: 1px solid rgba(65, 107, 82, 0.17);

        animation: resultIn 0.35s ease;
    }

    .result-header {
        display: flex;
        align-items: center;

        gap: 10px;

        margin-bottom: 12px;
    }

    .success-icon {
        width: 30px;
        height: 30px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: var(--forest-700);

        color: white;

        font-size: 14px;
        font-weight: bold;
    }

    .result-title {
        margin: 0;

        color: var(--forest-900);

        font-size: 14px;
        font-weight: 600;
    }

    .short-url-container {
        display: flex;

        gap: 8px;
    }

    .short-url-container input {
        min-width: 0;
        flex: 1;

        height: 48px;

        padding: 0 15px;

        border: 1px solid rgba(49, 91, 69, 0.18);

        border-radius: 12px;

        outline: none;

        background: rgba(255, 252, 244, 0.72);

        color: var(--forest-800);

        font-family: inherit;

        font-size: 14px;
        font-weight: 500;
    }

    .copy-btn {
        flex-shrink: 0;

        width: 86px;
        height: 48px;

        border: 0;
        border-radius: 12px;

        background: var(--forest-800);

        color: white;

        font-family: inherit;

        font-size: 13px;
        font-weight: 600;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    .copy-btn:hover {
        background: var(--forest-900);

        transform: translateY(-1px);
    }

    .open-link {
        display: block;

        margin-top: 12px;

        color: var(--forest-700);

        font-size: 12px;
        font-weight: 500;

        text-decoration: none;

        text-align: center;
    }

    .open-link:hover {
        text-decoration: underline;
    }

    /* Error */
    .error {
        display: none;

        margin-top: 16px;

        padding: 13px 15px;

        border-radius: 12px;

        background: rgba(154, 75, 55, 0.10);

        border: 1px solid rgba(154, 75, 55, 0.18);

        color: #754236;

        font-size: 13px;

        animation: resultIn 0.25s ease;
    }

    /* Footer */
    .footer {
        margin-top: 28px;

        text-align: center;

        color: rgba(55, 70, 61, 0.62);

        font-size: 12px;
    }

    .footer span {
        color: var(--forest-700);

        font-weight: 600;
    }

    /* Spinner */
    .spinner {
        width: 16px;

        border: 2px solid rgba(255, 255, 255, 0.35);

        animation: spin 0.7s linear infinite;

    /* Animations */
    @keyframes spin {

    @keyframes cardIn {
        from {
            opacity: 0;

            transform:
                translateY(20px)

        to {
            opacity: 1;

            transform:
                translateY(0)

        }
    }

    @keyframes resultIn {

        }

        to {
            opacity: 1;

            transform: translateY(0);
        }

            font-size: 30px;

        .description {
            margin-bottom: 26px;
        }

        textarea {

        }

        }

        .copy-btn {

        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;

            transition-duration: 0.01ms !important;
        }
    }
</style>

```
<main class="page">

    <section class="container">

        <div class="content">

            <div class="logo">
                &lt;/&gt;
            </div>

            <h1>Paste. Share. Done.</h1>

            <p class="description">
                Turn your text into a simple shareable link.
                Paste anything you want to keep or share.
            </p>

            <form id="pasteForm">

                <div class="input-wrapper">

                    <label
                        class="input-label"
                        for="textContent"
                    >
                        Your content
                    </label>

                    <textarea
                        id="textContent"
                        placeholder="Paste your text, code, notes, logs..."
                        spellcheck="false"
                        required
                    ></textarea>

                    <div class="textarea-footer">
                        <span id="charCount">0 characters</span>
                    </div>

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >
                    <span id="buttonText">
                        Create Paste
                    </span>

                    <span
                        class="arrow"
                        id="arrow"
                    >
                        →
                    </span>
                </button>

            </form>

            <div
                class="error"
                id="error"
            ></div>

            <div
                class="result"
                id="result"
            >

                <div class="result-header">

                    <div class="success-icon">
                        ✓
                    </div>

                    <p class="result-title">
                        Your paste is ready
                    </p>

                </div>

                <div class="short-url-container">

                    <input
                        type="text"
                        id="shortURL"
                        readonly
                    >

                    <button
                        type="button"
                        class="copy-btn"
                        id="copyBtn"
                    >
                        Copy
                    </button>

                </div>

                <a
                    href="#"
                    class="open-link"
                    id="openLink"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open paste ↗
                </a>

            </div>

            <div class="footer">
                Simple. Fast. <span>Shareable.</span>
            </div>

        </div>

    </section>

</main>

<script>
    const form = document.getElementById("pasteForm");

    const textContentInput =
        document.getElementById("textContent");

    const charCount =
        document.getElementById("charCount");

    const submitBtn =
        document.getElementById("submitBtn");

    const buttonText =
        document.getElementById("buttonText");

    const arrow =
        document.getElementById("arrow");

    const result =
        document.getElementById("result");

    const shortURLInput =
        document.getElementById("shortURL");

    const openLink =
        document.getElementById("openLink");

    const copyBtn =
        document.getElementById("copyBtn");

    const error =
        document.getElementById("error");


    /* Character counter */
    textContentInput.addEventListener(
        "input",
        () => {
            const count = textContentInput.value.length;

            charCount.textContent =
                `${count.toLocaleString()} character${count === 1 ? "" : "s"}`;
        }
    );


    /* Create paste */
    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const textContent =
                textContentInput.value;

            if (!textContent.trim()) {
                error.textContent =
                    "Please enter some content first.";

                error.style.display = "block";

                return;
            }

            /* Reset states */
            error.style.display = "none";
            result.style.display = "none";

            /* Loading state */
            submitBtn.disabled = true;

            buttonText.textContent =
                "Creating...";

            arrow.innerHTML =
                '<span class="spinner"></span>';

            try {

                const response =
                    await fetch(
                        "/api/v1/data",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                textContent
                            })
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        "Unable to create this paste."
                    );
                }

                /* Display result */
                shortURLInput.value =
                    data.shortURL;

                openLink.href =
                    data.shortURL;

                result.style.display =
                    "block";

                /* Scroll result into view */
                result.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });

            } catch (err) {

                error.textContent =
                    err.message;

                error.style.display =
                    "block";

            } finally {

                submitBtn.disabled =
                    false;

                buttonText.textContent =
                    "Create Paste";

                arrow.textContent =
                    "→";
            }
        }
    );


    /* Copy link */
    copyBtn.addEventListener(
        "click",
        async () => {

            const url =
                shortURLInput.value;

            try {

                await navigator.clipboard
                    .writeText(url);

            } catch (err) {

                /* Fallback */
                shortURLInput.select();

                document.execCommand("copy");
            }

            copyBtn.textContent =
                "Copied ✓";

            setTimeout(
                () => {
                    copyBtn.textContent =
                        "Copy";
                },
                1800
            );
        }
    );


    /* Select URL on click */
    shortURLInput.addEventListener(
        "click",
        () => {
            shortURLInput.select();
        }
    );
</script>
